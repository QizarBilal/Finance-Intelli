kind = "web"
previewPath = "/"
title = "MoneyMind AI"
version = "1.0.0"
id = "artifacts/moneymind"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25397

[services.development]
run = "pnpm --filter @workspace/moneymind run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moneymind", "run", "build" ]
serve = "static"
publicDir = "artifacts/moneymind/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25397"
BASE_PATH = "/"
